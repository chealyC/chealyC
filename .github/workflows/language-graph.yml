name: Update language graph

on:
  push:
    branches:
      - main

  schedule:
    - cron: "30 3 * * 0"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-language-graph:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      - name: Generate language graph
        run: |
          python language_graph.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add language_graph.svg

          if git diff --cached --quiet; then
            echo "No changes to the language graph."
          else
            git commit -m "Update language graph"
            git push
          fi
